# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: LabMI
repository: cnuradiology/cnuradiology
email:
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
github_username: cnuradiology
minimal_mistakes_skin: default
search: false
# Build settings
markdown: kramdown


# theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes


# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - bootstrap
  - jekyll/scholar
  
minimal_mistakes_skin: "sunrise" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# teaser: "/assets/images/mri_logo.png"

author:
  name   : "LabMI"
  avatar : "/assets/images/mri_logo.png"
  bio    : "We are seeking highly motivated research associates, mater and phD students, who are interested in machine/deep learning applications to medical imaging as well as developing new metabolic MRI techniques for probing disease metabolism. If you are interested, please contact Dr. Park at <a href= \"mailto: ipark@jnu.ac.kr\" style=\"color: #0000FF;\"> ipark@jnu.ac.kr </a>"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cnuradiology"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cnuradiology"

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      sticky: true

scholar:
  style: apa
  locale: en
  replace_strings: true
  join_strings:    true
  bibliography_template: bibtemplate 

  repository: /publications
  repository_file_delimiter: "." 
  sort_by: year
  order: ascending
  group_by: year

  source: ./_bibliography
  query: "@*"
